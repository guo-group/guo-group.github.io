<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{lab_name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: {{bg_color}};
            --text: {{text_color}};
            --accent: {{accent_color}};
            --secondary: {{secondary_color}};
            --header-font: 'IBM Plex Mono', monospace;
            --body-font: Helvetica, Arial, sans-serif;
            --sidebar-width: 13rem;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--body-font);
            line-height: 1.6;
			font-weight: 300;
        }

        h1, h2, h3, h4 {
            font-family: var(--header-font);
            color: var(--text);
            font-weight: 500;
        }

        a { color: var(--accent); }

        /* ---------- Sidebar navigation ---------- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 2rem 1.5rem;
            background: var(--bg);
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            overflow-y: auto;
        }

		.sidebar .lab-name {
    		font-family: var(--header-font);
    		font-size: 1.5rem;        /* was 1.05rem */
    		font-weight: 700;         /* was 600 */
    		line-height: 1.25;
    		margin-bottom: 2rem;      
    		color: #CC0033;
    		text-decoration: none;
		}

        /*.sidebar .lab-name {
            font-family: var(--header-font);
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 1.5rem;
            color: #CC0033;
            text-decoration: none;
        }*/

        .navigation {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .navigation a {
            font-family: var(--header-font);
            font-size: 0.95rem;
            text-decoration: none;
            color: var(--secondary);
            padding: 0.25rem 0;
            border-left: 2px solid transparent;
            padding-left: 0.75rem;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .navigation a:hover {
            color: var(--accent);
        }

        .navigation a.active {
            color: var(--accent);
            border-left-color: var(--accent);
        }

        /* ---------- Main content ---------- */
        .main-content {
            margin-left: var(--sidebar-width);
            max-width: 58rem;
            padding: 3rem 2.5rem 6rem;
        }

        .header-image {
            width: 100%;
            max-height: 22rem;
            object-fit: cover;
            border-radius: 6px;
            margin: 0 0 2rem;
        }

        .description {
            font-size: 1.05rem;
            color: var(--text);
            margin-bottom: 3rem;
        }

        section {
            scroll-margin-top: 2rem;
            margin-bottom: 4rem;
        }

        section > h2 {
            font-size: 1.6rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.4rem;
            margin-bottom: 1.5rem;
        }

        /* ---------- Research ---------- */
        .research-area {
            margin-bottom: 1.5rem;
        }

        .research-area h3 {
            color: var(--accent);
            margin-bottom: 0.3rem;
            font-size: 1.15rem;
        }

        .research-area p { 
			margin-top: 0; 
		}

        /* ---------- Team ---------- */
        #team h3 {
            font-size: 1.25rem;
            margin-top: 2rem;
            color: var(--secondary);
        }

        .team-member {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 1.75rem;
            align-items: flex-start;
        }

        .team-member-image {
            width: 7rem;
            height: 7rem;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.05);
        }

        .member-info h4 {
            margin: 0 0 0.2rem;
            font-size: 1.1rem;
        }

        .member-info p { margin: 0.15rem 0; }

        .member-info .role {
            color: var(--accent);
            font-style: italic;
        }

        .member-links a {
            font-family: var(--header-font);
            font-size: 0.9rem;
        }

        .alumni-list p {
            margin: 0.3rem 0;
            color: var(--text);
        }

        .prospective-content p {
            margin-bottom: 1rem;
        }

        /* ---------- News ---------- */
        .news-item {
            display: flex;
            gap: 1.5rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .news-date {
            font-family: var(--header-font);
            font-size: 0.85rem;
            color: var(--secondary);
            flex-shrink: 0;
            width: 10rem;
            white-space: nowrap;
            padding-top: 0.1rem;
        }

        .news-content { flex: 1; }

        .news-content > :first-child { margin-top: 0; }

        .news-photos {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.75rem;
        }

        .news-photo {
            width: 12rem;
        }

        .news-photo img {
            width: 100%;
            border-radius: 4px;
            display: block;
        }

        .news-photo .caption {
            font-size: 0.8rem;
            color: var(--secondary);
            margin: 0.3rem 0 0;
        }

        /* ---------- Publications ---------- */
        .scholar-note {
            font-size: 0.95rem;
            color: var(--secondary);
            margin-bottom: 2rem;
        }

        .pub-item {
            display: flex;
            gap: 1.25rem;
            padding: 1.25rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            align-items: flex-start;
        }

        .pub-number {
            font-family: var(--header-font);
            font-size: 0.85rem;
            color: var(--accent);
            flex-shrink: 0;
            width: 2.5rem;
            padding-top: 0.15rem;
        }

        .pub-image {
            flex-shrink: 0;
            width: 8rem;
        }

        .pub-image img {
            width: 100%;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            display: block;
        }

        .pub-details {
            flex: 1;
            min-width: 0;
        }

        .pub-title {
            margin: 0 0 0.35rem;
            font-size: 1.05rem;
            line-height: 1.35;
        }

        .pub-authors {
            margin: 0 0 0.35rem;
            font-size: 0.95rem;
            color: var(--text);
        }

        .pub-citation {
            margin: 0 0 0.4rem;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        .pub-doi {
            font-family: var(--header-font);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .pub-doi:hover {
            text-decoration: underline;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 720px) {
            .sidebar {
                position: sticky;
                height: auto;
                width: 100%;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
                border-right: none;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
                padding: 1rem 1.25rem;
                z-index: 10;
            }

            .sidebar .lab-name {
                margin-bottom: 0;
                font-size: 0.95rem;
                flex-basis: 100%;
            }

            .navigation {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 1.25rem;
            }

            .navigation a {
                border-left: none;
                padding-left: 0;
            }

            .navigation a.active {
                border-left: none;
                border-bottom: 2px solid var(--accent);
            }

            .main-content {
                margin-left: 0;
                padding: 2rem 1.25rem 5rem;
            }

            .team-member { flex-direction: column; }

            .news-item { flex-direction: column; gap: 0.35rem; }

            .news-date { width: auto; }

            .pub-item {
                flex-wrap: wrap;
                gap: 0.75rem;
            }
            .pub-number { width: auto; }
            .pub-image { width: 6rem; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <a href="#top" class="lab-name">{{lab_name}}</a>
        <nav class="navigation">
            {{navigation}}
        </nav>
    </aside>

    <main class="main-content" id="top">
        {{header_image}}
        <p class="description">{{description}}</p>

        <section id="research">
            <h2>Research</h2>
            {{research}}
        </section>

		
		<section id="talks">
    		{{talks}}
		</section>
		

        <section id="team">
            {{team}}
        </section>

        <section id="news">
            <h2>News</h2>
            {{news}}
        </section>

        <section id="publications">
            <h2>Publications</h2>
            {{publications}}
        </section>
    </main>

    <script>
        // Highlight the nav link for whichever section is in view
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('.navigation a');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const id = entry.target.getAttribute('id');
                    navLinks.forEach((link) => {
                        link.classList.toggle(
                            'active',
                            link.getAttribute('href') === '#' + id
                        );
                    });
                }
            });
        }, { rootMargin: '-40% 0px -55% 0px' });

        sections.forEach((s) => observer.observe(s));
    </script>
	<script data-goatcounter="https://guo-group.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
