# Research areas
research_areas:
  - title: Quantifying Molecular Order from Information
    description: >
      We measure the intrinsic organization of molecular systems directly from 
      configuration and trajectory data, drawing on information theory to capture 
      order even when it isn't obvious to the eye or expressible as a conventional 
      order parameter. We are exploring how such measures might serve as design 
      variables for tuning molecular assemblies.

  - title: Soft Materials for a Sustainable Environment
    description: >
      We design peptide-based materials that selectively bind pollutants,
      with a current focus on sensing and capturing nanoplastics from water.

  - title: Biomolecular Recognition and Assembly
    description: >
      We investigate the forces that drive binding and aggregation in biomolecular 
      systems. We are especially interested in how assembly is shaped by disordered 
      or irregular targets (e.g., nanoparticle surfaces, aggregation-prone proteins)
      and how those interactions influence function.
