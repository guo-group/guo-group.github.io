# Basic site info
lab_name: Guo Group @ Rutgers University

description: >
  Our lab uses molecular simulation, information theory, and machine learning to 
  understand and design functional soft materials, with global sustainability and 
  health challenges in mind. We are especially drawn to molecular organization that 
  is hard to characterize (whether from disorder, irregularity, or the lack of an 
  obvious order parameter) and to finding new ways to measure and tune that organization
  in service of function.

