# Prospectives
prospective_students:
  paragraph1: >
    We are seeking curious and motivated students who are interested in data- and information-driven
    modeling of biomolecules, polymers, and colloids. Students should have a strong background and
    interest in the physical sciences and mathematics. Previous experience in computer programming
    or molecular simulation is helpful but not required.

  paragraph2: >
    Current and prospective Ph.D. students are encouraged to contact Prof. Guo directly to discuss
    potential opportunities and research interests. Prospective graduate students should apply to the
    <a href="https://cbe.rutgers.edu/admissions/graduate-cbe">Rutgers CBE program</a>.

  paragraph3: >
    Highly motivated undergraduates are welcome to inquire about opportunities by (1) emailing Prof.
    Guo with a copy of their resume and details on their relevant coursework, or (2) applying through
    the <a href="https://aresty.rutgers.edu/">Aresty Research Center</a>. We
    appreciate the recent influx of high schoolers interested in doing research with us; high school
    researchers must join the lab through organized programs so that they can receive sufficient
    mentorship and structure. Undergraduates and high school researchers are expected to attend weekly
    group meetings and actively contribute to them.

